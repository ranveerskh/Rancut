name: RanCut Windows and Web
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: RanCut-v0.3.8-Windows
          path: release/RanCut-0.3.8-Windows.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RanCut-v0.3.8-Web-Assets
          path: dist
          if-no-files-found: error
