name: Prepare downloadable installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New test version, higher than installed (for example 0.6.5)'
        required: true
        default: '0.6.5'
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set installer version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Use a version like 0.6.5" }
          npm version $env:RELEASE_VERSION --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create draft GitHub Release with direct EXE asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "release/RanCut-$releaseVersion-Setup.exe"
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $installerSize = (Get-Item $installer).Length
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$releaseVersion/RanCut-$releaseVersion-Setup.exe"
          $publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          @{version=$releaseVersion;downloadUrl=$downloadUrl;sha256=$installerHash;size=$installerSize;publishedAt=$publishedAt} | ConvertTo-Json | Set-Content release/release-metadata.json
          $releaseNotes = "RELEASE-NOTES-$releaseVersion.md"
          if (-not (Test-Path $releaseNotes)) { "RanCut $releaseVersion - update detection and release workflow fixes." | Set-Content $releaseNotes }
          gh release create "v$releaseVersion" $installer release/release-metadata.json --draft --target "$env:GITHUB_SHA" --title "RanCut $releaseVersion" --notes-file $releaseNotes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: RanCut-Installer-and-Release-Metadata
          path: |
            release/*-Setup.exe
            release/release-metadata.json
          if-no-files-found: error
